[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-sdk"
version = "0.1.0"
description = "Shared Python SDK contracts and infrastructure for Eidolon projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
db = [
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
]
runtime = [
    "PyJWT>=2.8",
]
http = [
    "httpx>=0.27",
]
devices = [
    "cryptography>=43",
]
livekit = [
    "livekit-api>=0.5",
]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["eidolon_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
