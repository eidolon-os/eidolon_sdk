[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-sdk"
version = "0.1.0"
description = "Shared Python SDK contracts and infrastructure for Eidolon projects"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "grpcio>=1.62",
    "httpx>=0.27",
    "livekit-api>=0.5",
    "pydantic>=2.8",
    "protobuf>=4.25",
    "PyJWT>=2.8",
    "rfc8785>=0.1.4",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
audit = [
    "nats-py>=2.9",
]
db = [
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
]
runtime = [
    "PyJWT>=2.8",
]
http = [
    "httpx>=0.27",
]
admin = [
    "httpx>=0.27",
]
grpc = [
    "grpcio>=1.62",
    "protobuf>=4.25",
]
devices = [
    "cryptography>=43",
]
livekit = [
    "livekit-api>=0.5",
]
dev = [
    # Pinned, not floated: the generator decides the Protobuf gencode version
    # baked into the published bindings, and a runtime older than that gencode
    # refuses to load them. Consumers currently run protobuf 6.33, so the
    # generator must stay on the 6.31 gencode line.
    "grpcio-tools==1.73.1",
    "hatchling>=1.25",
    "jsonschema>=4.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["eidolon_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated bindings are protoc's output, not hand-written source; their shape
# is the generator's decision and the drift test is what guards them.
extend-exclude = ["eidolon_sdk/grpc"]
